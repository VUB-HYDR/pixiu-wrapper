[workspace]
authors = ["zawadzkim <zawadzkimat@outlook.com>"]
channels = ["conda-forge"]
name = "pixiu-wrapper"
platforms = ["linux-64", "win-64"]
version = "0.2.1"

[tasks]
test = "pytest -q"

[activation.env]
PYTHONNOUSERSITE = "1"

[dependencies]
python = ">=3.11,<3.13"
boto3 = ">=1.34.0,<2"
s3fs = ">=2024.3.0,<2026"
pandas = ">=2.2.0,<4"
xarray = ">=2024.2.0,<2027"
h5netcdf = ">=1.3.0,<2"
typer = ">=0.12.0,<1"
tomli-w = ">=1.0.0,<2"
pytest = ">=8.0.0,<9"
