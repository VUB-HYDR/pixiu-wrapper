[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixiu-wrapper"
version = "0.2.0"
description = "Simple Pixiu S3 wrapper for VUB storage"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "zawadzkim", email = "zawadzkimat@outlook.com" }
]
dependencies = [
  "boto3>=1.34.0,<2",
  "s3fs>=2024.3.0,<2026",
  "pandas>=2.2.0,<3",
  "xarray>=2024.2.0,<2027",
  "h5netcdf>=1.3.0,<2",
  "typer>=0.12.0,<1",
  "tomli-w>=1.0.0,<2"
]

[project.scripts]
pixiu = "pixiu.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
